name: Fast 3Oaks batch probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'feat/playwright-visual-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Probe three games in one Chromium
        run: node scripts/probe-3oaks-fast.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-3oaks-probe
          path: artifacts/probe-results.json
          if-no-files-found: warn
