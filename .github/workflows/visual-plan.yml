name: Run visual plan

on:
  push:
    paths:
      - 'analysis/visual-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-ci-visual-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-visual-plan.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-ci-visual-plan
          path: artifacts/visual-plan/
          retention-days: 7
