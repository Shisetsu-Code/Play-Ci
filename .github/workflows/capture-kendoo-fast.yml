name: Capture Kendoo layouts fast

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-kendoo-popups.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kendoo-layout-captures
          path: artifacts/kendoo-popups/
          retention-days: 1
