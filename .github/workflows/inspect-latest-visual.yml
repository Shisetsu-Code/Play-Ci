name: Inspect latest visual plan

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for latest visual plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$REPO" --workflow visual-plan.yml --branch "$BRANCH" --event push --limit 5 --json databaseId,status,createdAt --jq '.[0].databaseId')"
          echo "visual run: $RUN_ID"
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status
          mkdir -p latest-visual
          gh run download "$RUN_ID" --repo "$REPO" --name play-ci-visual-plan --dir latest-visual
          gh run view "$RUN_ID" --repo "$REPO" --json databaseId,headSha,conclusion,createdAt,updatedAt > latest-visual/run.json
      - uses: actions/upload-artifact@v4
        with:
          name: latest-visual-plan-copy
          path: latest-visual/
          retention-days: 1
