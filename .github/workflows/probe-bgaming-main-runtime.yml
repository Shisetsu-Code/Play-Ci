name: Probe BGaming main runtime

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/probe-bgaming-main-runtime.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgaming-main-runtime-probe
          path: artifacts/bg-runtime-probe/
          retention-days: 1
