name: Visual 3Oaks pass 2

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/visual-3oaks-pass2.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3oaks-visual-pass2
          path: artifacts/visual-pass2/
          retention-days: 1
