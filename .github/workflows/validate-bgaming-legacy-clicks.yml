name: Validate BGaming legacy visible clicks

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/validate-bgaming-legacy-clicks.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgaming-legacy-click-proof
          path: artifacts/bg-legacy-clicks/
          retention-days: 1
