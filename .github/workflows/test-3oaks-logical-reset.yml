name: Test 3Oaks logical reset

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-3oaks-logical-reset.js
