name: Diagnose Kendoo and Fairy

on:
  pull_request:
    paths:
      - 'scripts/diagnose-kendoo-fairy.js'
      - '.github/workflows/diagnose-kendoo-fairy.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/diagnose-kendoo-fairy.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kendoo-fairy-diagnosis
          path: artifacts/kendoo-fairy/
          retention-days: 1
