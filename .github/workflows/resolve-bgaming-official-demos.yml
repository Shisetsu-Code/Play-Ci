name: Resolve BGaming official demo links

on:
  pull_request:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/resolve-bgaming-official-demos.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgaming-official-demo-resolver
          path: artifacts/bg-official-demo-resolver/
          retention-days: 1
