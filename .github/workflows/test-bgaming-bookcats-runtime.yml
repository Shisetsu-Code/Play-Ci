name: Test Book of Cats Megaways runtime

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/bookcats-runtime-trigger.txt'

permissions:
  contents: read

jobs:
  test-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Execute declared BGaming modes
        run: node scripts/test-bgaming-bookcats-runtime.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookcats-runtime
          path: artifacts/bookcats-runtime/
          if-no-files-found: warn
          retention-days: 7
