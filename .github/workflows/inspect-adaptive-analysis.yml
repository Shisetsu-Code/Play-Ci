name: Inspect latest adaptive analysis

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for latest Analyze targets run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$REPO" --workflow analyze-targets.yml --branch "$BRANCH" --event push --limit 5 --json databaseId,headSha,status,createdAt --jq '.[0].databaseId')"
          echo "run_id=$RUN_ID" >> "$GITHUB_ENV"
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status
          mkdir -p adaptive-result
          gh run download "$RUN_ID" --repo "$REPO" --name play-ci-analysis --dir adaptive-result
          gh run view "$RUN_ID" --repo "$REPO" --json databaseId,headSha,conclusion,createdAt,updatedAt > adaptive-result/run.json

      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-analysis-result
          path: adaptive-result/
          retention-days: 1
