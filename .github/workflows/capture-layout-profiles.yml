name: Capture 3Oaks layout profiles

on:
  pull_request:
    paths:
      - 'scripts/capture-layout-profiles.js'
      - '.github/workflows/capture-layout-profiles.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-layout-profiles.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3oaks-layout-profiles
          path: artifacts/layout-profiles/
          retention-days: 1
