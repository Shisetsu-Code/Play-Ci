name: Inspect BGaming bootstrap

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/inspect-bgaming-bootstrap.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgaming-bootstrap-inspection
          path: artifacts/bg-bootstrap/
          retention-days: 1
