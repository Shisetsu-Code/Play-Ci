name: Diagnose Kendoo renderer

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/diagnose-kendoo-render.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kendoo-render-diagnosis
          path: artifacts/kendoo-render/
          retention-days: 1
