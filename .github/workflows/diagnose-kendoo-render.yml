name: Diagnose Kendoo rendering

on:
  pull_request:
    paths:
      - 'scripts/diagnose-kendoo-render.js'
      - '.github/workflows/diagnose-kendoo-render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/diagnose-kendoo-render.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kendoo-render-diagnosis
          path: artifacts/kendoo-render/
          retention-days: 1
