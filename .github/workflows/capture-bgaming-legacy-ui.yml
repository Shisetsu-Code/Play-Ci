name: Capture BGaming legacy UI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-bgaming-legacy-ui.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgaming-legacy-ui
          path: artifacts/bg-legacy-ui/
          retention-days: 1
