name: Inspect 3Oaks boosters

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/inspect-3oaks-boosters.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3oaks-booster-inspection
          path: artifacts/booster-inspection/
          retention-days: 1
