name: Inspect unresolved 3Oaks games

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/inspect-3oaks-review-games.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unresolved-game-inspection
          path: artifacts/review-games/
          retention-days: 1
