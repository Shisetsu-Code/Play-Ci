name: Inspect exhaustive result

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait and fetch exhaustive run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$REPO" --workflow exhaustive-3oaks.yml --branch "$BRANCH" --event push --limit 5 --json databaseId,status,headSha,createdAt --jq '.[0].databaseId')"
          echo "Run: $RUN_ID"
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status
          mkdir -p result
          gh run download "$RUN_ID" --repo "$REPO" --name 3oaks-exhaustive-final --dir result
          gh run view "$RUN_ID" --repo "$REPO" --json databaseId,headSha,conclusion,createdAt,updatedAt > result/run.json
      - uses: actions/upload-artifact@v4
        with:
          name: exhaustive-result-copy
          path: result/
          retention-days: 1
