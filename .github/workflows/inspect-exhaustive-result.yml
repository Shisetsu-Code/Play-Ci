name: Inspect exhaustive result

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait for exhaustive run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$REPO" --workflow analyze-exhaustive.yml --branch "$BRANCH" --event push --limit 5 --json databaseId,status,createdAt --jq '.[0].databaseId')"
          echo "run_id=$RUN_ID" >> "$GITHUB_ENV"
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status
          mkdir -p exhaustive-result
          gh run download "$RUN_ID" --repo "$REPO" --name exhaustive-final --dir exhaustive-result
          gh run view "$RUN_ID" --repo "$REPO" --json databaseId,headSha,conclusion,createdAt,updatedAt > exhaustive-result/run.json

      - uses: actions/upload-artifact@v4
        with:
          name: exhaustive-result-copy
          path: exhaustive-result/
          retention-days: 1
