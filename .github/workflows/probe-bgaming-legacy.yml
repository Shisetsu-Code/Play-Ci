name: Probe BGaming legacy

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/probe-bgaming-legacy.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgaming-legacy-probe
          path: artifacts/bg-legacy-probe/
          retention-days: 1
