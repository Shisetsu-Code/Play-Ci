name: Capture BGaming JSONRPC UI

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-bgaming-jsonrpc-ui.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgaming-jsonrpc-ui
          path: artifacts/bg-jsonrpc-ui/
          retention-days: 1
