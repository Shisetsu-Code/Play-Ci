name: Inspect final BGaming catalog

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for final Analyze targets run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: 06d412463ac93f12ef268e91949f85695fba3051
        run: |
          set -euo pipefail
          RUN_ID=""
          for i in $(seq 1 60); do
            RUN_ID="$(gh run list --repo "$REPO" --workflow analyze-targets.yml --event push --limit 30 --json databaseId,headSha,status --jq '.[] | select(.headSha=="'"$TARGET_SHA"'") | .databaseId' | head -n1)"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 5
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status
          mkdir -p result
          gh run download "$RUN_ID" --repo "$REPO" --name play-ci-analysis --dir result
          gh run view "$RUN_ID" --repo "$REPO" --json databaseId,headSha,conclusion,createdAt,updatedAt > result/run.json
      - uses: actions/upload-artifact@v4
        with:
          name: final-bgaming-catalog
          path: result/
          retention-days: 1
