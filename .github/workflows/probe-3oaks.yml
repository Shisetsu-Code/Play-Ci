name: 3Oaks probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'feat/playwright-visual-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Capture 3Oaks
        run: npm run capture -- "https://3oaks.com/api/v1/games/4_super_clover_pots/play?lang=en"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3oaks-super-clover-probe
          path: artifacts/
          if-no-files-found: warn
