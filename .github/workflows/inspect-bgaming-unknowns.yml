name: Inspect unresolved BGaming targets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/inspect-bgaming-unknowns.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgaming-unknown-inspection
          path: artifacts/bg-unknowns/
          retention-days: 1
