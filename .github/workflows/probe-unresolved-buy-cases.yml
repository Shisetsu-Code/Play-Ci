name: Probe unresolved 3Oaks buy cases

on:
  pull_request:

permissions:
  contents: read

jobs:
  exceptions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/diagnose-3oaks-buy-exceptions.js
      - run: node scripts/diagnose-kendoo-fairy.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unresolved-buy-cases
          path: |
            artifacts/buy-exceptions/
            artifacts/kendoo-fairy/
          retention-days: 1
