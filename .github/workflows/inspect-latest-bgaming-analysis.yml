name: Inspect latest BGaming analysis

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch latest Analyze targets artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$REPO" --workflow analyze-targets.yml --branch "$BRANCH" --event push --limit 10 --json databaseId,status,conclusion,headSha,createdAt --jq '[.[] | select(.status=="completed")][0].databaseId')"
          test -n "$RUN_ID"
          mkdir -p result
          gh run download "$RUN_ID" --repo "$REPO" --name play-ci-analysis --dir result
          gh run view "$RUN_ID" --repo "$REPO" --json databaseId,headSha,conclusion,createdAt,updatedAt > result/run.json
      - uses: actions/upload-artifact@v4
        with:
          name: latest-bgaming-analysis
          path: result/
          retention-days: 1
