name: Final BGaming catalog run

on:
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANALYSIS_DISCOVERY_CONCURRENCY: '4'
      ANALYSIS_RUNTIME_VALIDATION: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run analyze:targets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-bgaming-catalog-direct
          path: artifacts/analysis/
          retention-days: 1
