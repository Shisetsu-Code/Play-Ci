name: Probe native 3Oaks adapters

on:
  pull_request:

permissions:
  contents: read

jobs:
  buys:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-3oaks-native-buys.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-native-buy-results
          path: artifacts/native-buy-test/
          retention-days: 1
  boosters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-3oaks-native-boosters.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-native-booster-results
          path: artifacts/native-booster-test/
          retention-days: 1
