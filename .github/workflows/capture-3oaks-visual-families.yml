name: Capture 3Oaks visual families

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-3oaks-visual-families.js
      - uses: actions/upload-artifact@v4
        with:
          name: 3oaks-visual-families
          path: artifacts/visual-families/
          retention-days: 1
