name: Test headed Kendoo

on:
  pull_request:

permissions:
  contents: read

jobs:
  headed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a env HEADED=1 node scripts/kendoo-headed-capture.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kendoo-headed-result
          path: artifacts/kendoo-headed/
          retention-days: 1
